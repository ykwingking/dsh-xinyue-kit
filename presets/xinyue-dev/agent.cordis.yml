# 「新月杀开发模式」agent-plane 组合。
# 架构照搬 zero-anchored-standard(xiaobright/dsh-anchored-standard,MIT):
# 首轮 0 工具锚定 → 常驻集 = shell + str_replace_editor + 发现工具 + 新月杀工具链
# → 其余工具经 dev_tool_search 按需解锁。完整规范走 skill 按需加载。
#
# 服务行必须放进带 isolate 的 group(entry-local realm),否则第二会话挂载冲突。
# 纯工具行(只注册进 host tools registry、不 provide 服务)无需 realm。

# ── identity:complete 定死身份,压掉一切注入(含 xinyue-kit 全局 section) ──
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      你是新月杀(FreeKill)扩展开发工程师与工坊总指挥,只为本机游戏编写 Lua 包(武将技能、卡牌与玩法)。
      流程:任何任务先输出
      【需求理解确认】(逐技能/逐条规则:触发/频率/目标/数值/边界)并停下等用户确认,
      有歧义用 ask_user_question 问清;注意 ask_user_question 的回答只消除歧义、
      不算确认——歧义澄清后把最终确认单呈现给用户,仍须等到用户明确回复「确认」。
      未确认禁止写代码(确认前的只读调研不受限:
      可先 xinyue_search_reference 搜官方参考、xinyue_read_package 读已有包代码,再写确认单)。
      查资料按这个顺序:要「该读哪一章」先 xinyue_doc_index(书有 72 篇,别猜目录名),
      再用 xinyue_read_doc 读整节;查引擎符号(事件名/方法/常量/状态技字段)用 xinyue_api_lookup;
      素材先 xinyue_match_assets 给出「请求→文件」映射表让用户确认,再 xinyue_copy_images / xinyue_copy_audio。
      确认后逐技能实现,写完 xinyue_validate 校验通过后 xinyue_write_package 写入,
      素材用 xinyue_copy_images 复制图片、xinyue_copy_audio 复制配音,
      全部完成调 xinyue_skills_written 并提示测试。改已有包优先区块模式(区块读写;全文模式仅首写或未建索引的包,且必须带 editScope)。
      完整规范见常驻知识文本,并用 skill_load 加载 xinyue-extension-dev 技能;
      先想清方案再交付,交付前自查一遍。
    complete: true
    includeRuntimeContext: false

# 锚定轮晋级后,一次性提示"指令文件存在,需要时自己读"
- id: instruction-hint
  name: ./instruction-hint.mjs
  config:
    promoteOn: assistant-message

# 重工具按需解锁(web 等注册在 catalog 但平时隐藏)
- id: dev-tool-search
  name: ./dev-tool-search.mjs

# 首轮 0 工具;晋级后常驻集 = shells + str_replace_editor + 发现工具 + 新月杀链
- id: zero-tool-bootstrap
  name: ./zero-tool-bootstrap.mjs
  config:
    suppressedContextSources: [agent-instructions, skill-catalog]
    residentTools: [xinyue_search_reference, xinyue_doc_index, xinyue_read_doc, xinyue_api_lookup, xinyue_validate, xinyue_read_package, xinyue_write_package, xinyue_skills_written, xinyue_match_assets, xinyue_copy_images, xinyue_copy_audio]
    compactionTools: [read, glob, grep, xinyue_search_reference, xinyue_doc_index, xinyue_read_doc, xinyue_api_lookup, xinyue_validate, xinyue_read_package, xinyue_write_package, xinyue_skills_written, xinyue_match_assets, xinyue_copy_images, xinyue_copy_audio]

# 锚定轮固定用户消息
- id: anchor-turn
  name: ./anchor-turn.mjs
  config:
    text: 这一轮是新月杀开发模式的锚定轮,工具尚未开放;从下一轮起工具开放。

# ── shell(Windows 走 Git Bash 适配行) ─────────────────────────────────────
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: custom-bash
  name: ./custom-bash.mjs
  disabled: !!js process.platform !== 'win32'
  config:
    # Git Bash 路径自动探测(Program Files / (x86) / LOCALAPPDATA);非标准安装请显式指定:
    #   bashPath: 'D:/Git/bin/bash.exe'
    # bash 单次输出上限(阀门)在工坊「⚙ 设置」页调节(默认 64K,可调 64~256K);
    # 高级用户也可在此手改: maxOutputBytes: 64000(行配置优先于设置页)。

# ── filesystem ──────────────────────────────────────────────────────────────
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: bootstrap-filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

# ── skills:注册表在本 preset 层;目录不注入,按需 search/load ────────────────
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: skill-search
  name: ./skill-search.mjs

# ── compaction:长会话必需 ───────────────────────────────────────────────────
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── 其余模型面工具(轻量;web 注册但平时隐藏) ────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
